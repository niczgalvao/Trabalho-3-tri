<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand marca" href="index.html"><span class="marca-disco" aria-hidden="true"></span>Dojo</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav align-items-lg-center gap-lg-2">
                        <li class="nav-item"><a class="nav-link" href="index.html">Produtos</a></li>
                        <li class="nav-item" id="nav-login"><a class="nav-link nav-entrar" href="login.html">Entrar</a></li>
                    </ul>
                    <div class="dropdown ms-lg-3 my-2 my-lg-0">
                        <button id="user-info" class="btn btn-vidro dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="display: none">
                            Opções
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="cadastro.html">Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <form id="form_cadastro" class="vidro">
            <h1>Cadastro</h1>
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" required class="input_texto" autocomplete="name">
            </div>
            <div class="linha">
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato: 000.000.000-00" required class="input_texto">
                </div>
                <div class="campo">
                    <label for="celular">Celular</label>
                    <input type="tel" id="celular" placeholder="(99) 99999-9999" maxlength="15" pattern="\(\d{2}\) ?\d{4,5}-\d{4}" title="Formato: (99) 99999-9999" required class="input_texto" autocomplete="tel">
                </div>
            </div>
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" required class="input_texto" autocomplete="email">
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required minlength="6" class="input_texto" autocomplete="new-password">
            </div>
            <!-- CEP, Rua, Número, Bairro, Cidade, Estado(UF), Senha -->
            <!--
            <label for="cep">CEP:</label>
            <input type="text" id="cep" placeholder="00000-000" onblur="pesquisarCEP(this.value)" required class="input_texto">
            <p id="resposta"></p>

            <label for="rua">Rua:</label>
            <input type="text" id="rua" required class="input_texto">
            <label for="numero">Número:</label>
            <input type="number" id="numero" required class="input_texto">
            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" required class="input_texto">
            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" required class="input_texto">
            <label for="estado">Estado:</label>
            <input type="text" id="estado" required class="input_texto">
            -->
            <input type="submit" id="btn_enviar" value="Enviar cadastro" class="btn_enviar">
            <p class="troca">Já tem conta? <a href="login.html">Entrar</a></p>
        </form>
        <!-- ALERTA TOAST -->
        <div class="position-fixed" style="top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1050;">
            <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
                <div class="d-flex">
                    <div class="toast-body" id="toast-message">Mensagem</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
                </div>
            </div>
        </div>
        <!-- FIM ALERTA TOAST -->
    </main>
    <footer>Dojo · artes marciais</footer>
    <script>
        function pegarDados(){
            const dados = {
                nome: document.getElementById("nome").value,
                cpf: document.getElementById("cpf").value,
                celular: document.getElementById("celular").value,
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value
            }
            return dados
        }

        const form_cadastro = document.getElementById("form_cadastro")
        const btn_enviar = document.getElementById("btn_enviar")
        form_cadastro.addEventListener("submit", async (event)=>{
            event.preventDefault()
            btn_enviar.disabled = true
            btn_enviar.value = "Enviando cadastro..."
            const dados = pegarDados()
            //alert(JSON.stringify(dados))
            try {
                const resposta = await fetch("http://localhost:3000/cliente", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dados)
                })
                const json_resposta = await resposta.json().catch(() => ({}))
                if (!resposta.ok) {
                    throw new Error(json_resposta.msg || "Erro na API")
                }
                mostrarToast("✅ Cadastro enviado com sucesso!", "bg-success");
                form_cadastro.reset()
            } catch(error) {
                mostrarToast("❌ Falha ao enviar. " + error, "bg-danger");
            } finally {
                btn_enviar.value = "Enviar cadastro"
                btn_enviar.disabled = false
            }
        })
    </script>

    <script src="./pages.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
